<div class="home">
  <div class="welcome-box">
    <div class="globe">🌍</div>
    <h1 class="title">Detailed Countries</h1>
    <p class="subtitle">Explore every nation on Earth.</p>

    <div class="actions">
      <a routerLink="/countries" class="btn-primary">Browse Countries</a>
      <button class="btn-secondary" (click)="showModal = true">Observe Countries</button>
    </div>
  </div>
</div>

<app-add-country-modal *ngIf="showModal" (closed)="showModal = false" (countryAdded)="onCountryAdded($event)"></app-add-country-modal>
